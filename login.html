<body class="bg-surface text-on-surface font-body-md text-body-md antialiased selection:bg-primary selection:text-on-primary">
  
  <header class="h-16 w-full px-margin border-b border-outline-variant/40 bg-surface-container-lowest flex items-center justify-between">
    <a href="index.html">
      <img alt="Melete Brand Logo" class="h-8 w-auto object-contain" src="assets/logo.svg"/>
    </a>
    <a href="index.html" class="text-xs font-mono text-secondary hover:text-on-surface">← Back to Homepage</a>
  </header>

  <main class="w-full pt-16 pb-20 bg-surface flex items-center justify-center min-h-[calc(100vh-8rem)]">
    <div class="max-w-md w-full mx-auto px-margin space-y-6">
      
      <div class="space-y-2 text-center">
        <span class="font-mono text-xs uppercase tracking-widest text-secondary font-semibold">Candidate Portal</span>
        <h1 class="font-headline-lg text-headline-lg text-on-surface">Access Your Evaluation Profile</h1>
        <p class="font-body-md text-body-md text-on-surface-variant text-xs">
          Enter your registered details to view previous performance dossiers or launch a new attempt.
        </p>
      </div>

      <div class="bg-surface-container-lowest p-8 rounded-xl border border-outline-variant/60 shadow-xl space-y-6">
        
        <!-- Google Sign-in Button -->
        <button type="button" onclick="loginWithGoogle()" class="w-full py-2.5 px-4 rounded border border-outline-variant hover:border-primary bg-white text-on-surface font-label-md text-xs font-semibold flex items-center justify-center gap-3 transition-colors shadow-xs cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>

        </button>

        <div class="relative flex items-center justify-center border-t border-outline-variant/40 pt-4">
          <span class="bg-surface-container-lowest px-3 font-mono text-[10px] text-secondary uppercase absolute -top-2">or candidate email</span>
        </div>

        <form id="login-form" class="space-y-4">
          <div class="space-y-1.5">
            <label class="font-label-sm text-xs text-secondary font-mono uppercase">Student Email</label>
            <input id="login-email" type="email" required value="student@melete.ai" placeholder="name@example.com" class="w-full px-3.5 py-2.5 bg-surface-container-low border border-outline-variant rounded text-on-surface font-body-md focus:outline-none focus:border-primary placeholder:text-outline text-xs"/>
          </div>

          <button type="submit" class="w-full py-2.5 rounded bg-primary text-on-primary font-label-md text-xs uppercase tracking-wider hover:bg-[#0d2a60] transition-colors shadow-sm cursor-pointer">
            Sign In with Email
          </button>
        </form>

        <div class="relative flex items-center justify-center border-t border-outline-variant/40 pt-4">

        <div class="space-y-2 pt-1">
          <button onclick="quickLogin('Sarah Chen', 'sarah.chen@example.com', 'Imperial College London', 'Pre-CAS Interview')" class="w-full p-2.5 rounded bg-surface-container-low hover:bg-surface-container-high border border-outline-variant/40 text-left transition-colors flex items-center justify-between cursor-pointer">

            <span class="material-symbols-outlined text-secondary text-[16px]">arrow_forward</span>

          <button onclick="quickLogin('Aayush Adhikari', 'aayush.a@example.com', 'Coventry University', 'Pre-CAS Interview')" class="w-full p-2.5 rounded bg-surface-container-low hover:bg-surface-container-high border border-outline-variant/40 text-left transition-colors flex items-center justify-between cursor-pointer">
            <div>
              <span class="font-title-md text-xs font-bold text-on-surface block">Aayush Adhikari (Nepal)</span>
              <span class="text-[11px] text-secondary font-mono">Coventry University • UK Pre-CAS Track</span>
            </div>
            <span class="material-symbols-outlined text-secondary text-[16px]">arrow_forward</span>

  <script src="js/melete-core.js"></script>
  <script>
    async function loginWithGoogle() {
      // Prompt for name/email or authenticate
      const mockGoogleEmail = prompt('Enter your Google Email for student session tracking:', 'student.nepal@gmail.com');
      if (!mockGoogleEmail) return;
      const mockName = prompt('Enter your full name:', 'Prashant Thapa') || 'Student Candidate';

      const res = await fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: mockGoogleEmail,
          name: mockName,
          picture: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80'
        })
      });
      const data = await res.json();
      if (data.success && data.user) {
        localStorage.setItem('melete_user', JSON.stringify(data.user));
        window.location.href = 'practice.html';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const res = await fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name: email.split('@')[0] })
      });
      const data = await res.json();
      if (data.success && data.user) {
        localStorage.setItem('melete_user', JSON.stringify(data.user));
        window.location.href = 'practice.html';
      }
    });

    async function quickLogin(name, email, university, framework) {
      const res = await fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name })
      });
      const data = await res.json();
      if (data.success && data.user) {
        localStorage.setItem('melete_user', JSON.stringify(data.user));
      }
      const session = MeleteStorage.getDefaultSession();
      session.university = university;
      session.framework = framework;
      MeleteStorage.saveSession(session);
      window.location.href = 'practice.html';
    }
  </script>
