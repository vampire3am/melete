<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Melete Admin</title><link rel="icon" href="assets/favicon.svg"><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dbe2ea;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}main{max-width:1180px;margin:auto;padding:28px 20px}.brand{font-weight:800;color:#173d8f}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid #dbe2ea;border-radius:12px;padding:18px;margin-bottom:18px}.metric{font-size:30px;font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:6px;font-size:13px;font-weight:650;flex:1;min-width:170px}input,textarea,button{font:inherit}input,textarea{padding:10px;border:1px solid #bac6d4;border-radius:8px;background:#fff}textarea{min-height:80px}button{border:0;border-radius:8px;padding:10px 14px;background:#173d8f;color:#fff;cursor:pointer}button.secondary{background:#e7edf7;color:#173d8f}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0;vertical-align:top}.scroll{overflow:auto}.notice{padding:12px;border-radius:8px;background:#eef4ff;margin-bottom:16px}.error{background:#fff1f2;color:#9f1239}
</style></head><body><header><h1><span class="brand">MELETE</span> <span class="muted">/ Administrator</span></h1><div class="row"><a href="/index.html">Public site</a><button id="logout" class="secondary">Sign out</button></div></header><main>
<div id="notice" class="notice">Loading protected administration data…</div><section class="grid" aria-label="Statistics"><div class="card"><div class="muted">Candidates</div><div id="stat-users" class="metric">—</div></div><div class="card"><div class="muted">Sessions</div><div id="stat-sessions" class="metric">—</div></div><div class="card"><div class="muted">Average score</div><div id="stat-score" class="metric">—</div></div><div class="card"><div class="muted">AI service</div><div id="stat-ai" class="metric">—</div></div></section>
<section class="card"><h2>Add interview question</h2><form id="question-form"><div class="row"><label>Country<input name="country" required maxlength="100"></label><label>Category<input name="category" maxlength="200"></label><label>Tag<input name="tag" maxlength="200"></label></div><label>Question<textarea name="question_text" required maxlength="1500"></textarea></label><div class="row"><label>Recommended points<textarea name="recommended_points" maxlength="2000"></textarea></label><label>Red flags<textarea name="red_flags" maxlength="2000"></textarea></label></div><button type="submit">Add question</button></form></section>
<section class="card"><h2>Recent candidate sessions</h2><div class="scroll"><table><thead><tr><th>Candidate</th><th>Destination</th><th>Type</th><th>Score</th><th>Created</th></tr></thead><tbody id="sessions"></tbody></table></div></section><section class="card"><h2>Candidate directory</h2><div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Destination</th><th>Created</th></tr></thead><tbody id="users"></tbody></table></div></section>
</main><script src="js/melete-auth.js"></script><script src="js/admin-secure.js"></script></body></html>
